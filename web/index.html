<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llmctl Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #38bdf8; }
        h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #94a3b8; }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
        .vram-bar {
            height: 24px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .vram-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s ease;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 0.75rem;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.5rem; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 0.5rem; border-top: 1px solid #334155; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-loaded { background: #065f46; color: #6ee7b7; }
        .badge-unloaded { background: #7c2d12; color: #fca5a5; }
        .btn {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-right: 0.25rem;
        }
        .btn:hover { background: #475569; }
        .btn-load { background: #065f46; }
        .btn-load:hover { background: #047857; }
        .btn-unload { background: #7c2d12; }
        .btn-unload:hover { background: #991b1b; }
        .log {
            background: #0f172a;
            border-radius: 4px;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            color: #94a3b8;
        }
        .log-entry { margin-bottom: 0.25rem; }
        .log-time { color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>llmctl Dashboard</h1>

        <!-- VRAM Status -->
        <div class="card" hx-get="/api/ui/vram" hx-trigger="every 5s">
            <h2>GPU VRAM</h2>
            <div id="vram-status">Loading...</div>
        </div>

        <!-- Models -->
        <div class="card" hx-get="/api/ui/models" hx-trigger="every 5s">
            <h2>Models</h2>
            <div id="models-list">Loading...</div>
        </div>

        <!-- Logs -->
        <div class="card">
            <h2>Recent Events</h2>
            <div class="log" id="log-container" hx-get="/api/ui/logs" hx-trigger="every 3s"></div>
        </div>
    </div>
</body>
</html>
